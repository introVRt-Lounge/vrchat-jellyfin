<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>VRChat Jellyfin · IntroVRt Lounge</title>
		<meta
			name="description"
			content="Mint a Jellyfin stream URL for VRChat, ChilloutVR, or Resonite. Browse libraries, pick subtitles, paste in-world."
		/>
		<meta name="theme-color" content="#00e5ff" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="IntroVRt Lounge" />
		<meta property="og:title" content="VRChat Jellyfin · IntroVRt Lounge" />
		<meta
			property="og:description"
			content="Mint a Jellyfin stream URL for VRChat, ChilloutVR, or Resonite. Browse libraries, pick subtitles, paste in-world."
		/>
		<meta property="og:url" content="https://vrchat.introvrtlounge.com/share" />
		<meta property="og:image" content="https://vrchat.introvrtlounge.com/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="IntroVRt Lounge VRChat Jellyfin — mint a stream URL and paste it in-world"
		/>

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="VRChat Jellyfin · IntroVRt Lounge" />
		<meta
			name="twitter:description"
			content="Mint a Jellyfin stream URL for VRChat, ChilloutVR, or Resonite. Browse libraries, pick subtitles, paste in-world."
		/>
		<meta name="twitter:image" content="https://vrchat.introvrtlounge.com/og.png" />

		<style>
			:root {
				color-scheme: dark;
				--bg0: #0b0b10;
				--bg1: #14141c;
				--cyan: #00e5ff;
				--neon: #00ff9f;
				--text: #f5f5f7;
				--muted: #9aa0b5;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				font-family: ui-sans-serif, system-ui, sans-serif;
				color: var(--text);
				background:
					radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 229, 255, 0.14), transparent),
					linear-gradient(180deg, var(--bg0), var(--bg1));
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2rem;
			}
			main {
				max-width: 36rem;
				width: 100%;
				border: 1px solid rgba(0, 229, 255, 0.35);
				border-radius: 1rem;
				padding: 2rem;
				background: rgba(26, 26, 36, 0.85);
				box-shadow: 0 0 0 1px rgba(0, 229, 255, 0.08), 0 16px 48px rgba(0, 0, 0, 0.45);
				backdrop-filter: blur(10px);
			}
			p.eyebrow {
				margin: 0 0 0.5rem;
				color: var(--cyan);
				letter-spacing: 0.08em;
				text-transform: uppercase;
				font-size: 0.8rem;
			}
			h1 {
				margin: 0 0 0.75rem;
				font-size: clamp(1.8rem, 4vw, 2.4rem);
				letter-spacing: 0.03em;
				text-shadow: 0 0 18px rgba(0, 255, 159, 0.45);
			}
			p.lead {
				margin: 0 0 1.5rem;
				color: var(--muted);
				line-height: 1.5;
			}
			a.cta {
				display: inline-block;
				padding: 0.85rem 1.25rem;
				border-radius: 0.6rem;
				background: linear-gradient(90deg, #00e5ff, #00ff9f);
				color: #041018;
				font-weight: 700;
				text-decoration: none;
			}
			a.cta:hover {
				filter: brightness(1.05);
			}
			p.fine {
				margin: 1.25rem 0 0;
				font-size: 0.85rem;
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<main>
			<p class="eyebrow">IntroVRt Lounge</p>
			<h1>VRChat Jellyfin</h1>
			<p class="lead">
				Browse Jellyfin, pick subtitles, mint a stream URL, and paste it into VRChat /
				ChilloutVR / Resonite. Lounge Discord sign-in required for the mint UI.
			</p>
			<a class="cta" href="/">Open the mint UI</a>
			<p class="fine">Capability stream links stay public for the in-world player.</p>
		</main>
	</body>
</html>
