version: '3.8'

services:
  vrchat-jellyfin:
    image: ghcr.io/introvrt-lounge/vrchat-jellyfin:master
    container_name: vrchat-jellyfin-prod
    restart: unless-stopped
    networks:
      - traefik_net
    volumes:
      - vrchat-jellyfin-data:/data
    environment:
      # Required Jellyfin connection settings
      - JELLYFIN_HOST=${JELLYFIN_HOST:?}
      - JELLYFIN_USERNAME=${JELLYFIN_USERNAME:?}
      - JELLYFIN_PASSWORD=${JELLYFIN_PASSWORD:?}
      - JELLYFIN_DEVICE_ID=${JELLYFIN_DEVICE_ID:-jellyfin-vrchat}
      
      # Optional audio/video quality settings with defaults
      - AUDIO_BITRATE=${AUDIO_BITRATE:-192000}
      - VIDEO_BITRATE=${VIDEO_BITRATE:-5000000}
      - MAX_AUDIO_CHANNELS=${MAX_AUDIO_CHANNELS:-2}
      - MAX_HEIGHT=${MAX_HEIGHT:-1080}
      - MAX_WIDTH=${MAX_WIDTH:-1920}
      - PROXY_STORE_PATH=/data/proxies.json
      - UI_THEME=${UI_THEME:-lounge}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-1103814778616557638}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-1523973372285816943}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.http.routers.vrchat-jellyfin.rule=Host(`vrchat.introvrtlounge.com`) && !PathPrefix(`/v/`)"
      - "traefik.http.routers.vrchat-jellyfin.middlewares=auth@file,secureHeaders@file"
      - "traefik.http.routers.vrchat-jellyfin-video.rule=Host(`vrchat.introvrtlounge.com`) && PathPrefix(`/v/`)"
      - "traefik.http.routers.vrchat-jellyfin-video.middlewares=secureHeaders@file"

networks:
  traefik_net:
    external: true

volumes:
  vrchat-jellyfin-data:
