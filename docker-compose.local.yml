version: '3.8'

services:
  vrchat-jellyfin:
    # Build locally instead of pulling from registry
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vrchat-jellyfin-local
    restart: unless-stopped
    network_mode: host
    environment:
      # Required Jellyfin connection settings
      - JELLYFIN_HOST=${JELLYFIN_HOST}
      - JELLYFIN_USERNAME=${JELLYFIN_USERNAME}
      - JELLYFIN_PASSWORD=${JELLYFIN_PASSWORD}

      # Allow self-signed SSL certificates for development
      - NODE_TLS_REJECT_UNAUTHORIZED=0

      # Optional audio/video quality settings with defaults
      - AUDIO_BITRATE=${AUDIO_BITRATE:-192000}
      - VIDEO_BITRATE=${VIDEO_BITRATE:-5000000}
      - MAX_AUDIO_CHANNELS=${MAX_AUDIO_CHANNELS:-2}
      - MAX_HEIGHT=${MAX_HEIGHT:-1080}
      - MAX_WIDTH=${MAX_WIDTH:-1920}
      - UI_THEME=${UI_THEME:-lounge}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
